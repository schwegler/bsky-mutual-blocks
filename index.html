<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Standard Page Meta -->
    <title>Bluesky Mutual Block Checker</title>
    <meta name="description" content="Check and discover mutual blocks on Bluesky." />

    <!-- Open Graph / Facebook / Bluesky -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bsky-mutual-blocks.pages.dev/" />
    <meta property="og:title" content="Bluesky Mutual Block Checker" />
    <meta property="og:description" content="Check and discover mutual blocks on Bluesky." />
    <meta property="og:image" content="https://bsky-mutual-blocks.pages.dev/og-image.png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bsky-mutual-blocks.pages.dev/" />
    <meta name="twitter:title" content="Bluesky Mutual Block Checker" />
    <meta name="twitter:description" content="Check and discover mutual blocks on Bluesky." />
    <meta name="twitter:image" content="https://bsky-mutual-blocks.pages.dev/og-image.png" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Bluesky Mutual Block Checker</h1>
      </header>

      <main>
        <!-- Logged Out View -->
        <section id="auth-section" class="card" aria-labelledby="login-heading">
          <h2 id="login-heading">Sign In</h2>
          <p>Log in with your Bluesky handle to scan your mutuals.</p>
          <form id="login-form" aria-label="Sign in form">
            <label for="handle-input" class="visually-hidden">Bluesky Handle</label>
            <input
              type="text"
              id="handle-input"
              placeholder="e.g. alice.bsky.social"
              required
              aria-required="true"
            />
            <button type="submit">Log in with Bluesky</button>
          </form>
        </section>

        <!-- Logged In View -->
        <section id="app-section" class="card hidden" aria-label="Application area">
          <div class="user-header">
            <div id="user-profile-badge" aria-live="polite"></div>
            <button id="logout-btn" class="btn-secondary" aria-label="Sign out">Sign Out</button>
          </div>

          <div class="search-box">
            <label for="target-input" class="input-label">Target Bluesky Account</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="target-input"
                placeholder="Enter handle or search..."
                autocomplete="off"
                aria-autocomplete="list"
                aria-controls="suggestions-list"
                aria-expanded="false"
              />
              <ul id="suggestions-list" class="suggestions-dropdown hidden" role="listbox" aria-label="Search suggestions"></ul>
            </div>
            <button id="check-btn" aria-label="Check Mutual Blocks against target">Check Mutual Blocks</button>
            <div class="divider-text" aria-hidden="true">or</div>
            <button id="scan-mutuals-btn" class="btn-secondary" aria-label="Find Top Blockers Among Mutuals">Find Top Blockers Among Mutuals</button>
            <button id="scan-top-blocked-btn" class="btn-secondary" aria-label="Find Top Blocked Among Mutuals">Find Top Blocked Among Mutuals</button>
          </div>

          <div aria-live="assertive" aria-atomic="true">
            <div id="status-container" class="status-msg"></div>
          </div>
          
          <div id="progress-container" class="progress-container hidden" aria-hidden="true">
            <div class="progress-track">
              <div id="progress-bar-fill" class="progress-fill" style="width: 0%"></div>
            </div>
          </div>
          
          <div id="results-container" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
