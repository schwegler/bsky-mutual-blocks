name: Test Suite & Type Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, "codex/public-email-obfuscation" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit & integration tests with 100% coverage
        run: npm run test:coverage -- --maxWorkers=1

      - name: Build static application
        run: npm run build

      - name: Audit dependencies for high-severity advisories
        run: npm audit --audit-level=high
